name: teste-base-backend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: base_local
      POSTGRES_PASSWORD: base_local_dev
      POSTGRES_DB: base_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base_local -d base_local"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  postgres-data:
